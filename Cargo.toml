[package]
name = "araseo"
version = "0.1.26"
edition = "2024"
description = "Araseo, a lightweight Windows editor for WSL workspaces"
license = "MIT"
build = "build.rs"

[features]
ui-tests = ["gpui-kit/test-support"]

[dependencies]
gpui-kit = { version = "=0.7.3", features = ["tree-sitter-languages"] }
anyhow = "1"
hayro = "0.7.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
resvg = "0.47.0"
portable-pty = "0.9"
pulldown-cmark = "0.13.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lsp-types = "0.97"
vt100 = "0.16"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }

[build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Kernel", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[patch.crates-io]
vt100 = { path = "vendor/vt100" }
# Build release HLSL shaders for the Windows target when Cargo runs in WSL.
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.release]
debug = "line-tables-only"
strip = false
lto = "thin"
codegen-units = 1

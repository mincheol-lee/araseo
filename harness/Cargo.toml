[package]
name = "araseo-harness"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
hayro = "0.7.1"
portable-pty = "0.9"
pulldown-cmark = "0.13.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }

[patch.crates-io]
vt100 = { path = "../vendor/vt100" }
